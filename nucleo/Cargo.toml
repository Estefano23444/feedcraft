[package]
name = "nucleo"
version = "0.1.0"
edition = "2024"
description = "Núcleo de edición de imágenes de FeedCraft: Rust compilado a WebAssembly"
repository = "https://github.com/Estefano23444/feedcraft"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.129"
console_error_panic_hook = "0.1.7"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
fast_image_resize = "6.1.0"
jpeg-encoder = "0.7.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
moxcms = "0.8.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
