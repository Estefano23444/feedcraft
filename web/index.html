<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeedCraft</title>
  <meta name="description" content="Convierte una foto en imágenes listas para Instagram. Todo se procesa en tu navegador.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='1' x2='1' y2='0'%3E%3Cstop offset='0' stop-color='%23f58529'/%3E%3Cstop offset='.5' stop-color='%23dd2a7b'/%3E%3Cstop offset='1' stop-color='%238134af'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='8' y='7' width='16' height='18' rx='2' fill='none' stroke='white' stroke-width='2.4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="barra">
    <div class="marca">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="logo" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#f58529"/><stop offset=".5" stop-color="#dd2a7b"/><stop offset="1" stop-color="#8134af"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#logo)"/>
        <rect x="8" y="7" width="16" height="18" rx="2" fill="none" stroke="#fff" stroke-width="2.4"/>
      </svg>
      FeedCraft
    </div>
    <div class="barra-acciones">
      <button id="btn-nueva" class="boton boton-fantasma" type="button" hidden>Otra foto</button>
    </div>
  </header>

  <input id="archivo" type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" hidden>

  <main>
    <section id="inicio" class="inicio">
      <div>
        <label class="zona-carga" for="archivo" id="zona-carga">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="m21 15-4.5-4.5L6 21"/>
          </svg>
          <strong>Arrastra una foto aquí</strong>
          <span>o haz clic para elegirla</span>
          <small>JPEG, PNG o WebP · hasta 50 MB</small>
        </label>
        <p class="nota-privacidad">La foto se procesa en tu navegador. No sale de tu equipo.</p>
      </div>
    </section>

    <section id="editor" class="editor" hidden>
      <div class="escenario">
        <div class="escenario-centro">
          <div class="lienzo-caja" id="lienzo-caja">
            <canvas id="lienzo" width="1" height="1" aria-label="Vista previa de la foto"></canvas>
          </div>
        </div>
        <div class="escenario-pie">
          <span id="info-foto"></span>
          <span class="pie-derecha">
            <span id="tiempo-vista" title="Tiempo de la última vista previa"></span>
            <button id="btn-original" class="boton" type="button" aria-pressed="false" title="Comparar con la foto sin ajustes">Original</button>
          </span>
        </div>
        <div id="cargando" class="cargando" hidden><div><div class="girador"></div><span id="cargando-texto">Abriendo la foto…</span></div></div>
      </div>

      <aside class="panel">
        <section class="grupo">
          <h2>Formato</h2>
          <div class="segmento" id="formatos" role="group" aria-label="Formato de Instagram"></div>
          <div class="control control-zoom">
            <label for="zoom">Zoom del recorte</label>
            <output for="zoom" id="zoom-valor">100 %</output>
            <input id="zoom" type="range" min="100" max="300" step="1" value="100">
          </div>
          <div id="aviso-pequena" class="mensaje mensaje-aviso" hidden>
            <strong>Foto pequeña para este formato</strong>
            <span id="aviso-pequena-texto"></span>
            <div class="acciones">
              <button class="boton" type="button" data-ampliar="false" aria-pressed="true">Mantener tamaño real</button>
              <button class="boton" type="button" data-ampliar="true" aria-pressed="false">Ampliar a 1080 px</button>
            </div>
          </div>
        </section>

        <section class="grupo">
          <div class="grupo-cabecera">
            <h2>Ajustes</h2>
            <button id="btn-restablecer" class="enlace" type="button">Restablecer</button>
          </div>
          <div id="ajustes"></div>
        </section>

        <section class="grupo">
          <h2>Exportar</h2>
          <div class="control">
            <label for="enfoque">Enfoque</label>
            <output for="enfoque" id="enfoque-valor">30</output>
            <input id="enfoque" type="range" min="0" max="100" step="1" value="30">
          </div>
          <p class="detalle" id="medidas-salida"></p>
          <button id="btn-exportar" class="boton boton-primario boton-ancho" type="button">Descargar JPEG</button>
        </section>
      </aside>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
